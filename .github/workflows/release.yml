name: Release
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cycjimmy/semantic-release-action@9e1f8a3ef91f1097285028e799a5fb8bb90e8899 # v8.1.0
        with:
          extra_plugins: |
            semantic-release-github-actions-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
